# Refreshes the Sleeper player-id lookup that the moves block depends on.
#
# The source file is ~5MB and changes slowly, so this runs on its own daily
# schedule and the main collector never calls it (handoff section 7).
# Sleeper transaction metadata is null on every record, so without this file
# the Sleeper moves block renders raw numeric player ids.
#
# Trigger via cron-job.org firing workflow_dispatch, same pattern as
# collect.yml:
#   POST .../actions/workflows/players.yml/dispatches   {"ref":"main"}

name: Refresh player lookup

on:
  workflow_dispatch:

  # Backup only - cron-job.org is the real trigger. See collect.yml.
  # schedule:
  #   - cron: '30 9 * * *'

permissions:
  contents: write

jobs:
  players:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet truststore

      - name: Collect players
        run: python collect_players.py

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest/players.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "Update player lookup [skip ci]"

          # Same mandatory rebase-retry guard as collect.yml - this workflow and
          # the collector both write data/latest/.
          for i in 1 2 3 4 5; do
            echo "push attempt $i"
            if git push origin "HEAD:${BRANCH}"; then
              echo "pushed"
              exit 0
            fi
            git pull --rebase --autostash -X theirs origin "${BRANCH}" || true
            sleep $((i * 3))
          done
          echo "push failed after 5 attempts"
          exit 1
