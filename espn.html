<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZFL — ESPN Board</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/board.css">
</head>
<body>
<!-- --cols: #, avatar, team, record, points-for, streak, FAAB remaining -->
<div id="stage" style="--accent:#ff4436;--accent-rgb:255,68,54;--red:#8fa0b2;
             --cols:52px 54px 1fr 110px 116px 92px 96px;--moves-h:140px">

  <div class="hdr">
    <div>
      <div class="platform">ESPN</div>
      <h1 id="leagueName">&nbsp;</h1>
    </div>
    <div class="rt">
      <div class="live" id="liveFlag"><div class="dot"></div><span>LIVE</span></div>
      <div class="wk" id="weekPill">&nbsp;</div>
    </div>
  </div>
  <div class="rule"></div>

  <div id="body" style="display:none;flex-direction:column;flex:1 1 auto;min-height:0;gap:18px">
    <div class="blk">
      <div class="sec"><span id="heroLabel"></span><i></i></div>
      <div class="hero">
        <div class="top">
          <div class="side" id="sideA"></div>
          <div class="mid"><div class="v">VS</div><div class="delta" id="delta"></div></div>
          <div class="side right" id="sideB"></div>
        </div>
        <div class="bar"><div class="a" id="barA"></div><div class="b"></div></div>
      </div>
    </div>

    <div class="blk grow" id="swapZone"></div>

    <div class="blk">
      <div class="sec"><span id="mLabel"></span><i></i></div>
      <div class="mlist" id="mlist"></div>
    </div>

    <div class="blk" id="movesBlk">
      <div class="sec"><span>LATEST MOVES</span><i></i></div>
      <div class="moves" id="moves"></div>
    </div>
  </div>

  <div class="wait" id="wait">LOADING</div>

  <div class="ftr">
    <div id="lid"></div>
    <div class="stale" id="staleFlag"><div class="dot"></div><span>STALE</span></div>
    <div id="stamp"></div>
  </div>
</div>

<script>
/* ============================================================
   TUNING CONSTANTS
   ============================================================ */
const AUTO_FIT        = true;     // scale the 1080x1920 stage to fill the display.
                                  // The handoff assumed a native 1080x1920 panel; the
                                  // actual DAKboard is larger, so at 1:1 the board sat
                                  // in one corner. At exactly 1080x1920 the scale is 1
                                  // and this is a no-op. ?fit=0 forces 1:1.
const LIVE_DAYS       = [0];      // fallback only, when the payload has no game
                                  // windows (0=Sun). Normally the collector's
                                  // NFL-schedule windows decide LIVE.
const MODE_OVERRIDE   = null;     // 'live' | 'idle' forces a state
const TICK_MS         = 60000;    // master tick: re-evaluates mode and redraws
const REFRESH_MS      = 900000;   // data poll, idle
const REFRESH_LIVE_MS = 90000;    // data poll, live

const MOVES_PX_PER_SEC = 18;   // scroll speed of the moves list
const STRIP_ROWS       = 3;    // matchups visible at once before paging
const STRIP_GAP        = 9;    // must match the .mtrack gap in board.css
const STRIP_PAGE_SEC   = 9;    // seconds each page is held

const DATA_URL  = 'data/latest/espn.json';
const LEAGUE_ID = '1529795';

/* Preview helpers. ?mode=live|idle and ?fit=1 let the board be reviewed in a
   browser without editing the constants above. */
const QS = new URLSearchParams(location.search);

/* ============================================================
   STATE
   ============================================================ */
let data = null;        // last good payload; never cleared on a failed fetch
let fetchFailed = false;
let lastFetch = 0;
let lastSig = '';       // signature check, so the DOM is not rebuilt needlessly
let lastMovesSig = '';  // separate, so an unrelated data change does not restart the scroll
let lastStripSig = '';  // same, for the matchup strip's page cycle

/* ============================================================
   HELPERS
   ============================================================ */
const num = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function initials(name){
  return String(name || '').split(/\s+/).filter(Boolean).slice(0,2)
    .map(w => w[0]).join('').toUpperCase() || '?';
}

/* Collector emits either an absolute URL or a repo-relative path, for logos
   it had to mirror because they need auth. Both are used as-is; only a null
   or a load failure falls back to initials. */
function avatar(name, logo, size, me){
  const cls = 'av ' + size + (me ? ' me' : '');
  if (typeof logo === 'string' && logo.trim()){
    return '<div class="' + cls + '"><img src="' + esc(logo) + '" alt="" '
         + 'onerror="this.parentNode.textContent=\'' + initials(name) + '\'"></div>';
  }
  return '<div class="' + cls + '">' + initials(name) + '</div>';
}

function currentMode(){
  const q = QS.get('mode');
  if (q === 'live' || q === 'idle') return q;
  if (MODE_OVERRIDE) return MODE_OVERRIDE;
  // LIVE while any NFL game window is open (Thu night, Sunday, Mon night and
  // any odd Saturday or holiday game), from the collector's copy of the NFL
  // schedule. The windows are known in advance, so the flip lands on time
  // even between idle polls. Older payloads without windows use LIVE_DAYS.
  const w = data && data.windows;
  if (Array.isArray(w)){
    const now = Date.now();
    return w.some(x => now >= Date.parse(x.start) && now < Date.parse(x.end))
      ? 'live' : 'idle';
  }
  return LIVE_DAYS.includes(new Date().getDay()) ? 'live' : 'idle';
}

function fit(){
  const q = QS.get('fit');
  const on = q === '0' ? false : (q === '1' ? true : AUTO_FIT);
  const stage = document.getElementById('stage');
  if (!on){
    stage.style.transform = '';
    stage.style.left = '0px';
    stage.style.top = '0px';
    return;
  }
  // Uniform scale, then centre on both axes so any aspect-ratio mismatch
  // letterboxes evenly against the black page background rather than
  // pinning the board to a corner.
  const s = Math.min(innerWidth / 1080, innerHeight / 1920);
  stage.style.transform = 'scale(' + s + ')';
  stage.style.left = ((innerWidth  - 1080 * s) / 2) + 'px';
  stage.style.top  = ((innerHeight - 1920 * s) / 2) + 'px';
}

function clockOf(iso){
  const d = iso ? new Date(iso) : new Date();
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).toUpperCase();
}

/* ============================================================
   DATA
   ============================================================ */
async function load(){
  lastFetch = Date.now();
  try {
    const r = await fetch(DATA_URL + '?t=' + lastFetch, {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (!j || !Array.isArray(j.lineup)) throw new Error('shape');
    data = j;
    fetchFailed = false;
  } catch (e) {
    // Preserve whatever is on screen. A blank board is the failure mode to
    // avoid; an old board with a quiet stale marker is not.
    fetchFailed = true;
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function heroSide(t, right){
  return avatar(t.name, t.logo, 'lg', t.me)
    + '<div class="txt">'
    + '<div class="tag"' + (right ? ' style="color:var(--cream-30)"' : '') + '>'
    + (right ? 'OPPONENT' : 'YOU') + '</div>'
    + '<div class="nm">' + esc(t.name) + '</div>'
    + '<div class="rec">' + esc(t.rec) + '</div>'
    + '<div class="pts">' + num(t.pts).toFixed(1) + '</div>'
    + (t.proj == null ? '' : '<div class="proj">PROJ ' + num(t.proj).toFixed(1) + '</div>')
    + '</div>';
}

function renderLineup(d){
  const rows = d.lineup.map(r => {
    const ap = num(r.a && r.a.p), bp = num(r.b && r.b.p);
    const cell = (p, side, win) => {
      const r2 = side === 'b' ? ' r' : '';
      if (!p || p.empty){
        return '<div class="cell empty' + r2 + '">'
             + '<div class="p">' + num(p && p.p).toFixed(1) + '</div>'
             + '<div class="n">Empty</div></div>';
      }
      return '<div class="cell' + r2 + (win ? ' win' : '') + '">'
           + '<div class="p">' + num(p.p).toFixed(1) + '</div>'
           + '<div class="n">' + esc(p.n) + '<em>' + esc(p.t) + '</em></div></div>';
    };
    return '<div class="slot">' + cell(r.a, 'a', ap > bp)
      + '<div class="pos' + (r.pos === 'FLEX' ? ' flex' : '') + '">' + esc(r.pos) + '</div>'
      + cell(r.b, 'b', bp > ap) + '</div>';
  }).join('');

  return '<div class="sec"><span>HEAD TO HEAD</span><i></i></div>'
    + '<div class="luhead">'
    + '<div class="h"><span>' + esc(d.hero.a.name) + '</span></div><div></div>'
    + '<div class="h r"><span>' + esc(d.hero.b.name) + '</span></div></div>'
    + '<div class="lu">' + rows + '</div>'
    + '<div class="bench"><b>' + num(d.bench && d.bench.a).toFixed(1) + '</b>'
    + '<div>BENCH POINTS</div><b>' + num(d.bench && d.bench.b).toFixed(1) + '</b></div>';
}

function renderStandings(d){
  const budget = (d.faab && d.faab.budget) || 0;
  const rows = d.standings || [];
  // playoffPct is ESPN-only and is not always supplied. When it is missing the
  // column falls back to points-for rather than rendering an empty column.
  const odds = rows.some(r => r.playoffPct != null);

  const html = rows.map((r, i) => {
    // 7 of 12 make the playoffs, so highlighting every qualifying row would
    // light up most of the table and mean nothing. A single divider between
    // seed 7 and seed 8 instead (handoff s7).
    const cls = 'trow' + (r.me ? ' me' : '')
              + (i === d.playoffCut - 1 ? ' cut' : '');
    const c = (r.s || '')[0] === 'W' ? 'var(--green)'
            : (r.s || '')[0] === 'L' ? 'var(--red)' : 'var(--cream-50)';
    const mid = odds
      ? '<div class="pf">' + (r.playoffPct == null ? '—'
          : (r.playoffPct * 100).toFixed(0) + '%') + '</div>'
      : '<div class="pf">' + num(r.pf).toFixed(1) + '</div>';
    const faab = (r.faab == null) ? ''
      : '<div class="fb' + (budget && r.faab <= budget * 0.25 ? ' low' : '') + '">$'
        + Math.round(r.faab) + '</div>';
    return '<div class="' + cls + '"><div class="rk">' + (i + 1) + '</div>'
      + '<div>' + avatar(r.t, r.logo, 'sm') + '</div>'
      + '<div class="tn">' + esc(r.t) + '</div>'
      + '<div class="rc">' + num(r.w) + '-' + num(r.l) + '</div>'
      + mid
      + '<div class="stk" style="color:' + c + '">' + esc(r.s) + '</div>'
      + faab + '</div>';
  }).join('');

  return '<div class="sec"><span>STANDINGS</span><i></i></div>'
    + '<div class="thead"><div>#</div><div></div><div>TEAM</div><div>REC</div>'
    + '<div style="text-align:right">' + (odds ? 'PLAYOFF' : 'PTS FOR') + '</div>'
    + '<div style="text-align:right">STRK</div>'
    + '<div style="text-align:right">FAAB</div></div>'
    + '<div class="tbl">' + html + '</div>';
}

/* Inject or replace a keyframes rule. Used for the strip, whose page offsets
   depend on measured row height and so cannot be written statically. */
function injectKeyframes(name, body){
  let el = document.getElementById('kf-' + name);
  if (!el){ el = document.createElement('style'); el.id = 'kf-' + name;
            document.head.appendChild(el); }
  el.textContent = '@keyframes ' + name + '{' + body + '}';
}

/* Mount the matchup strip. Shows STRIP_ROWS games at a time and pages through
   the rest, holding each page long enough to read before sliding. Unlike the
   moves feed these are scores, so they sit still while being read rather than
   scrolling continuously. Carries its own signature so a poll that changes
   only the timestamp does not restart the cycle mid-page. */
function mountStrip(list){
  const games = list || [];
  const sig = JSON.stringify(games);
  if (sig === lastStripSig) return;
  lastStripSig = sig;

  const box = document.getElementById('mlist');
  const side = (t, pts, right, lead) =>
    '<div class="t' + (right ? ' r' : '') + (lead ? ' lead' : '') + '">'
    + avatar(t.n, t.logo, 'sm')
    + '<span class="s">' + num(pts).toFixed(1) + '</span>'
    + '<span class="n">' + esc(t.n) + '</span></div>';
  const rows = games.map(m => {
    const aLead = num(m.pa) >= num(m.pb);
    return '<div class="m">' + side(m.a, m.pa, false, aLead)
      + '<div class="sep">VS</div>' + side(m.b, m.pb, true, !aLead) + '</div>';
  }).join('');

  box.innerHTML = '<div class="mtrack" id="mtrack">' + rows + '</div>';
  const n = games.length;
  if (!n){ box.style.height = ''; return; }

  const track = document.getElementById('mtrack');
  // offsetHeight, not getBoundingClientRect: the latter includes the stage's
  // scale transform, so on a display larger than 1080x1920 it reports scaled
  // pixels and the window comes out oversized.
  const rowH = track.children[0].offsetHeight;
  const shown = Math.min(n, STRIP_ROWS);
  // Fixed window, so the swap zone above gets a deterministic remainder.
  box.style.height = (shown * rowH + (shown - 1) * STRIP_GAP) + 'px';
  if (n <= STRIP_ROWS) return;               // everything fits, nothing moves

  // Page offsets are clamped so the last page is full rather than part empty;
  // one game repeats across the boundary, which reads better than a gap.
  const pages = Math.ceil(n / STRIP_ROWS);
  const step = rowH + STRIP_GAP;
  const slot = 100 / pages;
  let kf = '';
  for (let i = 0; i < pages; i++){
    const y = (-Math.min(i * STRIP_ROWS, n - STRIP_ROWS) * step).toFixed(1) + 'px';
    kf += (i * slot).toFixed(2) + '%{transform:translateY(' + y + ')}';
    kf += (i * slot + slot * 0.88).toFixed(2) + '%{transform:translateY(' + y + ')}';
  }
  kf += '100%{transform:translateY(0)}';
  injectKeyframes('mpage', kf);
  track.style.setProperty('--m-dur', (pages * STRIP_PAGE_SEC) + 's');
  track.classList.add('paging');
}

/* Mount the moves list. When it overflows its fixed height the track is
   duplicated and scrolled at a constant slow rate; when it fits, nothing
   animates. Carries its own signature because the payload's `updated` field
   changes on every collector run, and remounting would restart the scroll
   mid-cycle. */
function mountMoves(list){
  const sig = JSON.stringify(list || []);
  if (sig === lastMovesSig) return;
  lastMovesSig = sig;

  const box = document.getElementById('moves');
  const item = m => '<div class="mv ' + esc(m.k) + '">'
    + '<div class="kind">' + esc(m.k).toUpperCase() + '</div>'
    + '<div class="txt">' + m.txt + '</div>'
    + '<div class="when">' + esc(m.when) + '</div></div>';
  const rows = (list || []).map(item).join('');
  if (!(list || []).length){
    // A 7-day window is legitimately empty in a quiet week. Say so rather
    // than leaving a blank block.
    box.innerHTML = '<div class="mv none"><div class="kind">—</div>'
      + '<div class="txt">No moves in the last 7 days</div></div>';
    return;
  }
  box.innerHTML = '<div class="mvtrack" id="mvtrack">' + rows + '</div>';

  const track = document.getElementById('mvtrack');
  const need = track.scrollHeight, have = box.clientHeight;
  if (need <= have) return;                       // fits, stays still

  track.innerHTML = rows + rows;                  // second copy for the loop
  const shift = need + 8;                         // one copy plus the row gap
  track.style.setProperty('--mv-shift', '-' + shift + 'px');
  track.style.setProperty('--mv-dur', (shift / MOVES_PX_PER_SEC).toFixed(1) + 's');
  track.classList.add('rolling');
}

function render(){
  const live = currentMode() === 'live';
  const stale = !!(data && data.stale) || fetchFailed;

  document.getElementById('staleFlag').className = 'stale' + (stale ? ' on' : '');

  if (!data){
    document.getElementById('wait').textContent = fetchFailed ? 'NO DATA' : 'LOADING';
    return;
  }

  // Signature check: skip the rebuild entirely when nothing changed, to avoid
  // reflow and animation restarts on the Pi.
  const sig = live + '|' + stale + '|' + JSON.stringify(data);
  if (sig === lastSig) return;
  lastSig = sig;

  const d = data;
  document.getElementById('wait').style.display = 'none';
  document.getElementById('body').style.display = 'flex';

  document.getElementById('leagueName').textContent = d.league || '';
  document.getElementById('weekPill').textContent = 'WEEK ' + num(d.week);
  document.getElementById('lid').textContent = 'LEAGUE ' + LEAGUE_ID;
  document.getElementById('liveFlag').style.display = live ? 'flex' : 'none';
  document.getElementById('heroLabel').textContent =
    live ? 'YOUR MATCHUP' : 'WEEK ' + num(d.week) + ' MATCHUP';
  document.getElementById('mLabel').textContent =
    live ? 'AROUND THE LEAGUE' : 'WEEK ' + num(d.week) + ' MATCHUPS';

  document.getElementById('sideA').innerHTML = heroSide(d.hero.a, false);
  document.getElementById('sideB').innerHTML = heroSide(d.hero.b, true);

  const pa = num(d.hero.a.pts), pb = num(d.hero.b.pts), diff = pa - pb;
  const dEl = document.getElementById('delta');
  dEl.textContent = (diff >= 0 ? '+' : '') + diff.toFixed(1);
  dEl.className = 'delta ' + (diff >= 0 ? 'up' : 'down');
  // Before kickoff both sides are 0.0; split the bar rather than dividing by zero.
  document.getElementById('barA').style.width =
    ((pa + pb) > 0 ? (pa / (pa + pb) * 100) : 50).toFixed(1) + '%';

  document.getElementById('swapZone').innerHTML =
    live ? renderLineup(d) : renderStandings(d);
  mountStrip(d.matchups);

  document.getElementById('movesBlk').style.display = live ? 'none' : 'flex';
  mountMoves(d.moves);

  // Timestamp comes from the payload, not the clock, so a board whose
  // collector has stopped visibly shows old data rather than a fresh time.
  document.getElementById('stamp').textContent = 'UPDATED ' + clockOf(d.updated);
}

/* ============================================================
   MASTER TICK - one timer drives mode flips, polling and redraw
   ============================================================ */
async function tick(){
  const interval = currentMode() === 'live' ? REFRESH_LIVE_MS : REFRESH_MS;
  if (!data || (Date.now() - lastFetch) >= interval) await load();
  render();
}

addEventListener('resize', fit);
fit();
tick();
setInterval(tick, TICK_MS);
</script>
</body>
</html>
